              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          # The tavern group. The stage config is the plugin package's `tavernCardsStageConfig`
          # plus this deployment's `language`; the delegation rows come from `loadTavernAgents()`.
          - id: tavern
            name: cordis:group
            group: true
            isolate:
              stage: true
            config:
              - id: stage-switch
                name: '@ai4rpg/dsh-stage-switch'
                config:
                  stages:
                    - name: route
                      instruction: You are in the route stage, which owns no artifact. Classify the
                        user's request and call goto_stage to jump to the stage
                        that owns it — design (a fresh project's direction, or
                        revising design-spec.md), planning (creative
                        planning/scope or 创作规划.yaml), content (new or revised
                        entries, MVU/EJS/configure, opening messages), or ui
                        (status bar or frontend). A direction change is design
                        work even when design-spec.md already exists; a tweak to
                        an already-planned entry, scope parameter, or the
                        interface is NOT design work — it belongs to its owning
                        stage. Do the work there, not here.
                    - name: design
                      instruction: 'Work in the `tavern-design` skill: discuss the big picture and
                        produce design-spec.md for the project before starting
                        implementation.'
                    - name: planning
                      instruction: 'Work in the `tavern-cards` skill: align requirements, initialize
                        the project, and write 创作规划.yaml until it is converged.'
                    - name: content
                      instruction: 'Use the `tavern-cards` skill to create or revise card content:
                        write and register all planned entries, implement
                        MVU/EJS/configure when required, and write the opening
                        messages. Packaging is available at any time as a
                        preview/verification action.'
                    - name: ui
                      instruction: 'Work in the `tavern-ui` skill: build the text status bar or
                        frontend UI as required, and verify it in SillyTavern
                        with packaged previews.'
                  minHandoffTokens: 10000
                  section: "Current stage policy: every stage owns a deliverable — design:
                    design-spec.md (a fresh project's direction); planning:
                    创作规划.yaml (scope); content: new or revised entries,
                    MVU/EJS/configure, opening messages; ui: the status bar or
                    frontend. goto_stage can jump to any stage — forward,
                    backward, or skipping — not only the next; jump backward
                    when an earlier artifact must change. A direction change is
                    design work even when design-spec.md already exists; a tweak
                    to an already-planned artifact (an entry, a scope parameter,
                    or the interface) is NOT design work — it belongs to its
                    owning stage, usually content. Completion signals here are
                    file-based heuristics and can fire early or stay stale; if
                    you are still mid-change, finish the current work first and
                    treat this as a checkpoint, not an order to move on. When
                    the current stage's deliverable is genuinely done, call
                    goto_stage to advance."
