                ## 输入参数


                - **项目目录路径**：未单独提供 `schema.ts` / `创作规划.yaml` 路径时，两者默认位于此目录

                - **创作规划路径**：项目目录下的 `创作规划.yaml`（未提供时默认为项目目录下）

